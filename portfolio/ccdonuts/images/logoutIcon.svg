<svg width="32" height="30" viewBox="0 0 32 30" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <mask id="openGapMaskWide">
      <rect width="32" height="30" fill="white"/>
      <!-- 左側の出口をさらに広げて、抜け出している印象を強める -->
      <rect x="-2" y="7.6" width="12.2" height="14.8" rx="1.4" fill="black"/>
    </mask>
  </defs>

  <!-- 矢印は元の位置感を保ったまま左向き -->
  <path d="M7.5 13.5V9L0 15L7.5 21V16.5H21V13.5H7.5Z" fill="#7F5539"/>

  <!-- 輪っかは左側の出口を少し大きめに開けたC形 -->
  <circle cx="16.5" cy="15" r="13.5" stroke="#7F5539" stroke-width="3" fill="none" mask="url(#openGapMaskWide)"/>
</svg>
