<svg width="32" height="30" viewBox="0 0 32 30" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <mask id="openGapMask">
      <rect width="32" height="30" fill="white"/>
      <!-- 左側の出口を少し広めに抜いて、矢印の先端と干渉しないようにする -->
      <rect x="-1" y="8.5" width="9.8" height="13" rx="1.2" fill="black"/>
    </mask>
  </defs>

  <!-- 矢印は元の位置感を保ったまま左向きへ反転 -->
  <path d="M7.5 13.5V9L0 15L7.5 21V16.5H21V13.5H7.5Z" fill="#7F5539"/>

  <!-- 輪っかは左側の開口部を少し広げたC形 -->
  <circle cx="16.5" cy="15" r="13.5" stroke="#7F5539" stroke-width="3" fill="none" mask="url(#openGapMask)"/>
</svg>
